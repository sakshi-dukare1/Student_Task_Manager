<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Login</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <div class="login-page">
      <div class="login-card">
        <div class="login-header">
          <div class="logo">ST</div>
          <h1>Student Login</h1>
          <p>Welcome back! Sign in to continue with your tasks.</p>
        </div>

        <form id="login-form" novalidate>
          <div class="field-group">
            <label for="student-name">Student Name</label>
            <input id="student-name" name="studentName" type="text" placeholder="Enter your name" required />
          </div>

          <div class="field-group">
            <label for="student-email">Email</label>
            <input id="student-email" name="studentEmail" type="email" placeholder="student@example.com" required />
          </div>

          <div class="field-group">
            <label for="student-password">Password</label>
            <input id="student-password" name="studentPassword" type="password" placeholder="Enter password" required />
          </div>

          <div id="login-message" class="login-message" role="alert" aria-live="polite"></div>

          <button type="submit" class="login-btn">Login</button>
        </form>
      </div>
    </div>

    <script src="login.js"></script>
  </body>
</html>
